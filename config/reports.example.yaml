reports:
  student_metrics_summary:
    display_name: "Student Metrics Summary"
    url_env: "CISDM_STUDENT_METRICS_EXPORT_URL"
    year_scope:
      param: "@Enrollment_ProgramID"
      # optional: fail the pull when this column disagrees with the requested school year
      verify_column: "School Year"
    # optional: Form.aspx module page visited before export to establish app context
    context_url_env: "CISDM_STUDENT_METRICS_CONTEXT_URL"
    expected_extension: ".xlsx"
    min_size_bytes: 10000
    required_columns:
      - Organization
      - School
      - Student ID
      - Client ID
      - Student Name
      - Grade Level
      - Case Manager
      - Goal
      - Metric
      - Baseline
      - Target
      - Latest Progress
  user_logins:
    display_name: "User Logins"
    retrieval_strategy: ui_export
    ui_entry_url_env: CISDM_USER_LOGINS_ENTRY_URL
    expected_extension: ".xlsx"
    min_size_bytes: 1
    required_columns: []
  accreditation:
    display_name: "Accreditation"
    retrieval_strategy: ui_export
    ui_entry_url_env: CISDM_ACCREDITATION_ENTRY_URL
    # WHY: URLID is year-frozen; verify Report Options instead of rewriting the URL
    year_scope:
      verify_report_options: "School Year:"
    expected_extension: ".xlsx"
    min_size_bytes: 1
    required_columns: []
  # school-level exports: year lives in @XSchoolNeedsAssess_X_SchoolYear (same id space as @Enrollment_ProgramID)
  school_community_characteristics:
    display_name: "School & Community Characteristics"
    url_env: "CISDM_SCHOOL_COMMUNITY_CHARACTERISTICS_EXPORT_URL"
    year_scope:
      param: "@XSchoolNeedsAssess_X_SchoolYear"
    expected_extension: ".xlsx"
    min_size_bytes: 1
    required_columns: []
  school_needs_summary_export:
    display_name: "School Needs Summary Export"
    url_env: "CISDM_SCHOOL_NEEDS_SUMMARY_EXPORT_URL"
    year_scope:
      param: "@XSchoolNeedsAssess_X_SchoolYear"
    expected_extension: ".xlsx"
    min_size_bytes: 1
    required_columns: []
  school_needs_assessment_school_demographics_export:
    display_name: "School Needs Assessment Summary - School Demographics Export"
    url_env: "CISDM_SCHOOL_NEEDS_ASSESSMENT_SCHOOL_DEMOGRAPHICS_EXPORT_URL"
    year_scope:
      param: "@XSchoolNeedsAssess_X_SchoolYear"
    expected_extension: ".xlsx"
    min_size_bytes: 1
    required_columns: []
  school_needs_assessment_improvement_plan_community_data_export:
    display_name: "School Needs Assessment Summary - School Improvement Plan and Community Data Export"
    url_env: "CISDM_SCHOOL_NEEDS_ASSESSMENT_IMPROVEMENT_PLAN_COMMUNITY_DATA_EXPORT_URL"
    year_scope:
      param: "@XSchoolNeedsAssess_X_SchoolYear"
    expected_extension: ".xlsx"
    min_size_bytes: 1
    required_columns: []
  school_goals_progress_export:
    display_name: "School Goals and Progress Export"
    url_env: "CISDM_SCHOOL_GOALS_PROGRESS_EXPORT_URL"
    year_scope:
      param: "@XSchoolNeedsAssess_X_SchoolYear"
    expected_extension: ".xlsx"
    min_size_bytes: 1
    required_columns:
      - School
      - Metric
      - Baseline Value
      - Target Value
