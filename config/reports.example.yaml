reports:
  student_metrics_summary:
    display_name: "Student Metrics Summary"
    url_env: "CISDM_STUDENT_METRICS_EXPORT_URL"
    expected_extension: ".xlsx"
    min_size_bytes: 10000
    required_columns:
      - Organization
      - School
      - Student ID
      - Client ID
      - Student Name
      - Grade Level
      - Case Manager
      - Goal
      - Metric
      - Baseline
      - Target
      - Latest Progress
  user_logins:
    display_name: "User Logins"
    retrieval_strategy: ui_export
    ui_entry_url_env: CISDM_USER_LOGINS_ENTRY_URL
    expected_extension: ".xlsx"
    min_size_bytes: 1
    required_columns: []
  accreditation:
    display_name: "Accreditation"
    retrieval_strategy: ui_export
    ui_entry_url_env: CISDM_ACCREDITATION_ENTRY_URL
    expected_extension: ".xlsx"
    min_size_bytes: 1
    required_columns: []
