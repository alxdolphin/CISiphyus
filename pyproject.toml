[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cisiphyus"
version = "0.4.0"
description = "CISDM report export automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.49.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cisiphyus = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "artifacts",
    "auth_cookies",
    "bootstrap",
    "browser",
    "cli",
    "config",
    "example_cli",
    "fetch",
    "report",
    "url_refresh",
    "validate",
]
